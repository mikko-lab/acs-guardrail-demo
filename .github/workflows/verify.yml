name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: npm run verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  tenant-mutants:
    name: tenant mutant gate (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Named mutants, witnesses and expected assertions are fixed in mutants/tenant/manifest.json (hash-checked).
      # Exit 0 only if the control passes and every mutant is detected by its named witness with its evidence kind.
      - run: npm run mutants:tenant
      # The gate's own regressions: an inventory change and an unexpected error must be technical failures (exit 2);
      # the real M27e mutant must still be detected.
      - run: npm run mutants:tenant:regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-mutant-report
          path: |
            out/mutants-tenant/report.json
            out/mutant-gate-regressions/
          if-no-files-found: warn
